<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piano Chord Sheet — Pyramid Song</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #fff;
    color: #1a1a1a;
    padding: 32px;
  }

  @media print {
    body { padding: 16px; }
    .chord-card { break-inside: avoid; }
    .header { margin-bottom: 16px; }
  }

  .header {
    text-align: center;
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 2px solid #1a1a1a;
  }
  .header h1 {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .header .sub {
    font-size: 13px;
    color: #666;
    margin-top: 4px;
    font-family: 'JetBrains Mono', monospace;
  }
  .header .legend {
    display: flex;
    justify-content: center;
    gap: 24px;
    margin-top: 8px;
    font-size: 12px;
    font-family: 'JetBrains Mono', monospace;
  }
  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legend-swatch {
    width: 14px;
    height: 14px;
    border-radius: 3px;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .chord-card {
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 14px 14px 10px;
  }

  .chord-name {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 2px;
  }
  .chord-notes {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: #555;
    margin-bottom: 10px;
    line-height: 1.5;
  }

  .keyboard-wrap {
    display: flex;
    justify-content: center;
  }

  svg.keyboard {
    width: 100%;
    max-width: 520px;
    height: auto;
  }

  .finger-legend {
    display: flex;
    justify-content: center;
    gap: 16px;
    font-size: 10px;
    color: #888;
    margin-top: 6px;
    font-family: 'JetBrains Mono', monospace;
  }
  .finger-legend .lh { color: #d97706; }
  .finger-legend .rh { color: #3b82f6; }

  .footer {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: #999;
    border-top: 1px solid #eee;
    padding-top: 12px;
  }
</style>
</head>
<body>

<div class="header">
  <h1>Piano Chord Reference — Pyramid Song</h1>
  <div class="sub">1=thumb 2=index 3=middle 4=ring 5=pinky</div>
  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:#d97706;"></div> Left Hand</div>
    <div class="legend-item"><div class="legend-swatch" style="background:#3b82f6;"></div> Right Hand</div>
  </div>
</div>

<div class="grid" id="chordGrid"></div>

<div class="footer">LH plays parallel 5ths (root + 5th) beneath each chord</div>

<script>
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

const START_OCTAVE = 3;
const NUM_OCTAVES = 3;

const WHITE_KEY_W = 22;
const WHITE_KEY_H = 90;
const BLACK_KEY_W = 14;
const BLACK_KEY_H = 56;

const COLOR_RH = '#3b82f6';
const COLOR_LH = '#d97706';

function isBlackNote(name) { return name.includes('#'); }

function noteToMidi(name, octave) {
  return octave * 12 + NOTE_NAMES.indexOf(name);
}

function buildKeys() {
  const keys = [];
  for (let oct = START_OCTAVE; oct < START_OCTAVE + NUM_OCTAVES; oct++) {
    for (const n of NOTE_NAMES) {
      keys.push({ name: n, octave: oct, midi: noteToMidi(n, oct) });
    }
  }
  return keys;
}

function getBlackKeyPosition(blackKey, whiteKeys) {
  const noteBelow = { 'C#': 'C', 'D#': 'D', 'F#': 'F', 'G#': 'G', 'A#': 'A' };
  const target = noteBelow[blackKey.name];
  for (let i = 0; i < whiteKeys.length; i++) {
    if (whiteKeys[i].name === target && whiteKeys[i].octave === blackKey.octave) return i;
  }
  return null;
}

function buildKeyboard(rhNotes, lhNotes) {
  const allKeys = buildKeys();
  const whiteKeys = allKeys.filter(k => !isBlackNote(k.name));
  const blackKeys = allKeys.filter(k => isBlackNote(k.name));

  const totalWhite = whiteKeys.length;
  const svgW = totalWhite * WHITE_KEY_W + 2;
  const svgH = WHITE_KEY_H + 28;

  const highlightMap = {};
  for (const h of lhNotes) {
    highlightMap[noteToMidi(h.name, h.octave)] = { finger: h.finger, color: COLOR_LH };
  }
  for (const h of rhNotes) {
    highlightMap[noteToMidi(h.name, h.octave)] = { finger: h.finger, color: COLOR_RH };
  }

  let svg = `<svg class="keyboard" viewBox="0 0 ${svgW} ${svgH}" xmlns="http://www.w3.org/2000/svg">`;

  // White keys
  whiteKeys.forEach((k, i) => {
    const x = 1 + i * WHITE_KEY_W;
    const hl = highlightMap[k.midi];
    const fill = hl ? hl.color : '#fff';
    svg += `<rect x="${x}" y="0" width="${WHITE_KEY_W - 1}" height="${WHITE_KEY_H}" fill="${fill}" stroke="#555" stroke-width="1"/>`;
    if (hl) {
      svg += `<text x="${x + WHITE_KEY_W/2 - 0.5}" y="${WHITE_KEY_H - 8}" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" font-family="DM Sans, sans-serif">${hl.finger}</text>`;
      svg += `<text x="${x + WHITE_KEY_W/2 - 0.5}" y="${WHITE_KEY_H + 14}" text-anchor="middle" font-size="7.5" font-weight="500" fill="${hl.color}" font-family="JetBrains Mono, monospace">${k.name}${k.octave}</text>`;
    }
  });

  // Black keys
  blackKeys.forEach(k => {
    const whiteIdx = getBlackKeyPosition(k, whiteKeys);
    if (whiteIdx === null) return;
    const x = 1 + whiteIdx * WHITE_KEY_W + WHITE_KEY_W - BLACK_KEY_W / 2 - 0.5;
    const hl = highlightMap[k.midi];
    const fill = hl ? hl.color : '#1a1a1a';
    svg += `<rect x="${x}" y="0" width="${BLACK_KEY_W}" height="${BLACK_KEY_H}" fill="${fill}" stroke="#333" stroke-width="0.5" rx="0 0 2 2"/>`;
    if (hl) {
      svg += `<text x="${x + BLACK_KEY_W/2}" y="${BLACK_KEY_H - 6}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" font-family="DM Sans, sans-serif">${hl.finger}</text>`;
      svg += `<text x="${x + BLACK_KEY_W/2}" y="${WHITE_KEY_H + 14}" text-anchor="middle" font-size="7.5" font-weight="500" fill="${hl.color}" font-family="JetBrains Mono, monospace">${k.name.replace('#','\u266F')}${k.octave}</text>`;
    }
  });

  svg += '</svg>';
  return svg;
}

const chords = [
  {
    label: 'F\u266F',
    subtitle: 'F\u266F Major',
    notesStr: 'LH: F\u266F + C\u266F \u00A0|\u00A0 RH: F\u266F \u2013 A\u266F \u2013 C\u266F',
    rh: [
      { name: 'F#', octave: 4, finger: 1 },
      { name: 'A#', octave: 4, finger: 3 },
      { name: 'C#', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'F#', octave: 3, finger: 5 },
      { name: 'C#', octave: 4, finger: 1 },
    ]
  },
  {
    label: 'Gmaj7',
    subtitle: 'G Major 7th',
    notesStr: 'LH: G + D \u00A0|\u00A0 RH: G \u2013 B \u2013 D \u2013 F\u266F',
    rh: [
      { name: 'G', octave: 4, finger: 1 },
      { name: 'B', octave: 4, finger: 2 },
      { name: 'D', octave: 5, finger: 3 },
      { name: 'F#', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'G', octave: 3, finger: 5 },
      { name: 'D', octave: 4, finger: 1 },
    ]
  },
  {
    label: 'A6',
    subtitle: 'A Major 6th',
    notesStr: 'LH: A + E \u00A0|\u00A0 RH: A \u2013 C\u266F \u2013 E \u2013 F\u266F',
    rh: [
      { name: 'A', octave: 4, finger: 1 },
      { name: 'C#', octave: 5, finger: 2 },
      { name: 'E', octave: 5, finger: 4 },
      { name: 'F#', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'A', octave: 3, finger: 5 },
      { name: 'E', octave: 4, finger: 1 },
    ]
  },
  {
    label: 'G',
    subtitle: 'G Major',
    notesStr: 'LH: G + D \u00A0|\u00A0 RH: G \u2013 B \u2013 D',
    rh: [
      { name: 'G', octave: 4, finger: 1 },
      { name: 'B', octave: 4, finger: 3 },
      { name: 'D', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'G', octave: 3, finger: 5 },
      { name: 'D', octave: 4, finger: 1 },
    ]
  },
  {
    label: 'F\u266Fm',
    subtitle: 'F\u266F Minor',
    notesStr: 'LH: F\u266F + C\u266F \u00A0|\u00A0 RH: F\u266F \u2013 A \u2013 C\u266F',
    rh: [
      { name: 'F#', octave: 4, finger: 1 },
      { name: 'A', octave: 4, finger: 3 },
      { name: 'C#', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'F#', octave: 3, finger: 5 },
      { name: 'C#', octave: 4, finger: 1 },
    ]
  },
  {
    label: 'E(add9)',
    subtitle: 'E Add 9',
    notesStr: 'LH: E + B \u00A0|\u00A0 RH: E \u2013 G\u266F \u2013 B \u2013 F\u266F',
    rh: [
      { name: 'E', octave: 4, finger: 1 },
      { name: 'G#', octave: 4, finger: 2 },
      { name: 'B', octave: 4, finger: 3 },
      { name: 'F#', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'E', octave: 3, finger: 5 },
      { name: 'B', octave: 3, finger: 1 },
    ]
  },
  {
    label: 'F\u266F(\u266D9)',
    subtitle: 'F\u266F Flat 9',
    notesStr: 'LH: F\u266F + C\u266F \u00A0|\u00A0 RH: F\u266F \u2013 A\u266F \u2013 C\u266F \u2013 G',
    rh: [
      { name: 'F#', octave: 4, finger: 1 },
      { name: 'A#', octave: 4, finger: 2 },
      { name: 'C#', octave: 5, finger: 4 },
      { name: 'G', octave: 5, finger: 5 },
    ],
    lh: [
      { name: 'F#', octave: 3, finger: 5 },
      { name: 'C#', octave: 4, finger: 1 },
    ]
  },
];

const grid = document.getElementById('chordGrid');

chords.forEach(chord => {
  const card = document.createElement('div');
  card.className = 'chord-card';
  card.innerHTML = `
    <div class="chord-name">${chord.label}</div>
    <div class="chord-notes">${chord.notesStr}</div>
    <div class="keyboard-wrap">${buildKeyboard(chord.rh, chord.lh)}</div>
    <div class="finger-legend">
      <span class="lh">LH: ${chord.lh.map(n => n.finger).join(' \u2013 ')}</span>
      <span class="rh">RH: ${chord.rh.map(n => n.finger).join(' \u2013 ')}</span>
    </div>
  `;
  grid.appendChild(card);
});
</script>
</body>
</html>
